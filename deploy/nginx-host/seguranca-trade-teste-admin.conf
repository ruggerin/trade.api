# Cabeçalhos de segurança do admin (trade-teste.prossigatec.com.br). Incluído no server 443.
# `always` = vale também pra respostas de erro. Nenhum `add_header` dentro de `location`, senão o
# nginx deixa de herdar estes.
server_tokens off;

# HSTS começando curto (1 dia), sem includeSubDomains/preload — subir pra 1 ano depois de validar.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# clipboard-write fica liberado (botão de copiar código de autorização).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# CSP em modo Report-Only: não bloqueia nada, só acusa violação no console do navegador.
# Depois de alguns dias sem violação, trocar o nome do cabeçalho pra Content-Security-Policy.
# 'unsafe-inline' em style-src: MUI/Emotion injeta <style> em runtime.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://trade-teste-api.prossigatec.com.br https://*.digitaloceanspaces.com; connect-src 'self' https://trade-teste-api.prossigatec.com.br; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
