# Cabeçalhos de segurança da API (trade-teste-api.prossigatec.com.br). Incluído no server 443.
server_tokens off;

# O nginx de dentro do container já manda estes dois — esconde os de lá pra não duplicar.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;

add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# API só devolve JSON/arquivos: nada pode ser embutido nem carregar recurso. Report-Only primeiro
# (PDF/imagem abertos direto no navegador podem reagir diferente) — validar e depois ativar.
add_header Content-Security-Policy-Report-Only "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
