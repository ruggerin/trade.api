name: Testes da API

on:
  push:
    branches: ['**']
  pull_request:

# O repositório da API tem os arquivos na RAIZ (não numa pasta api/) — por isso nenhum passo usa
# working-directory (versões antigas deste arquivo usavam e nunca rodaram no GitHub).

jobs:
  test:
    runs-on: ubuntu-latest

    # phpunit.xml define DB_HOST/PORT/DATABASE/USERNAME (e vence sobre variável de ambiente do
    # shell pra essas, testado: um DB_DATABASE exportado no shell é ignorado) mas de propósito
    # NÃO define DB_PASSWORD — é a única credencial que o phpunit.xml deixa pro ambiente externo
    # (local: api/.env.testing, gitignorado; aqui: a env: do passo "Rodar testes", abaixo). Senha
    # do container é efêmera, criada e destruída a cada run — nunca precisou ser a senha real de
    # ninguém, só precisa bater com o DB_PASSWORD passado pro artisan.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_apenas_efemero
          POSTGRES_DB: pdv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql, pgsql, mbstring, bcmath, ctype, fileinfo
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Gerar APP_KEY (.env mínimo pro artisan rodar fora do contexto de teste)
        run: |
          cp .env.example .env
          php artisan key:generate

      # Sem passo de migration manual de propósito: phpunit.xml já injeta APP_ENV=testing +
      # DB_DATABASE=pdv_test antes do boot, e o trait RefreshDatabase (usado em todo teste de
      # tests/Feature) migra o banco de teste sozinho no primeiro teste que rodar — é
      # assim que já funciona localmente, nunca precisou de "php artisan migrate --env=testing"
      # manual. Rodar isso aqui de novo (repetindo o comando manual) cairia no MESMO bug que
      # zerou o pdv_dev localmente: sem .env.testing no checkout do CI (é gitignorado),
      # "--env=testing" voltaria pro .env normal.
      - name: Rodar testes
        env:
          DB_PASSWORD: ci_apenas_efemero
        run: php artisan test
