# Versão (aparece no app, no admin e como release no Sentry) — carimbe data + commit no build:
#   APP_VERSAO=$(date +%Y.%m.%d)-$(git rev-parse --short HEAD) docker compose up -d --build
services:
  app:
    build:
      context: .
      args:
        APP_VERSAO: ${APP_VERSAO:-dev}
    container_name: tradeteste_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:9002:8080"
    volumes:
      - storage_logs:/var/www/html/storage/logs
    networks:
      - tradeteste
      - postgres-docker_default

networks:
  tradeteste:
    driver: bridge
  postgres-docker_default:
    external: true

volumes:
  storage_logs:
