; Uploads: default do PHP (2M) rejeitaria silenciosamente o upload de foto de registro/perfil
; antes de chegar no Laravel — StoreVisitaRegistroRequest permite até 8MB, folga aqui pro
; overhead do multipart (mesmo limite espelhado em docker/nginx.conf).
upload_max_filesize = 20M
post_max_size = 21M

memory_limit = 256M
max_execution_time = 60

; Produção: opcache liga e não reconfere timestamp de arquivo a cada request (mais rápido) — só
; importa porque todo deploy já reconstrói a imagem inteira, não tem "editar arquivo e ver
; refletir na hora" nesse ambiente.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000

expose_php = Off
