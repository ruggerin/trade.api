server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # StoreVisitaRegistroRequest aceita imagem até 8MB (ver docs/02-API-BACKEND.md) — folga
    # generosa pro overhead do multipart, senão o Nginx rejeita o upload antes mesmo dele chegar
    # no PHP (mesmo limite espelhado em docker/php.ini pro lado do PHP-FPM).
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    # Nunca serve dotfiles (.env, .git etc.) mesmo que alguém erre o root um dia.
    location ~ /\. {
        deny all;
    }

    # stdout/stderr em vez de arquivo — "docker logs" já mostra tudo, sem precisar entrar no
    # container pra ler log.
    access_log /dev/stdout;
    error_log /dev/stderr;
}
