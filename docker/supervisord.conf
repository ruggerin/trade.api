; Roda php-fpm + nginx + cron no mesmo container — mais simples que 3 containers separados só
; pra esta API numa VPS única. Se um dia o tráfego justificar escalar nginx/php-fpm
; independentemente, essa é a costura natural pra separar (ver Dockerfile).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Dispara App\Console\Commands\GerarOrdensServicoPor* (campanha/agenda/contrato) e qualquer
; outro Schedule::command de routes/console.php — sem isso rodando, esses comandos nunca
; disparam sozinhos, só se alguém entrar no container e rodar na mão.
[program:cron]
command=crond -f -l 8
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
